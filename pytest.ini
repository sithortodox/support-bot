[tool:pytest]
asyncio_mode = auto
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    -v
    --tb=short
    --strict-markers
    --cov=.
    --cov-report=term-missing
    --cov-report=html:htmlcov
    --cov-fail-under=50
markers =
    slow: marks tests as slow
    integration: marks tests as integration tests
    unit: marks tests as unit tests

[tool:coverage:run]
source = .
omit = 
    tests/*
    */migrations/*
    */__pycache__/*
    */site-packages/*
    */venv/*

[tool:coverage:report]
precision = 2
show_missing = True
skip_covered = False

[tool:ruff]
line-length = 100
target-version = py311
select = 
    E
    F
    I
    N
    W
    UP
    B
    C4
    DTZ
    T20
    RUF
ignore = 
    E501
    B008
    C901

[tool:ruff.per-file-ignores]
"tests/*" = S101

[tool:black]
line-length = 100
target-version = ['py311']
include = '\.pyi?$'
